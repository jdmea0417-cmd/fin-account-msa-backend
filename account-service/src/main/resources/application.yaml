server:
  port: 0

spring:
  application:
    name: account-service

  h2:
    console:
      enabled: true
      settings:
        web-allow-others: true
      path: /h2-console

  datasource:
    url: jdbc:mariadb://localhost:3306/appdb
    username: appuser
    password: apppassword
    driver-class-name: org.mariadb.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}

token:
  secret: my-very-long-secret-key-1234567890123456
  expiration-in-days: 10