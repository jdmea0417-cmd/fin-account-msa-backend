server:
  port: 8080

spring:
  application:
    name: gateway
  config:
    import: optional:configserver:${CONFIG_SERVER_URI:http://config-service:8888}

  cloud:
    stream:
      kafka:
        binder:
          brokers: ${KAFKA_BROKERS:localhost:9092}

cors:
  allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://eureka-service:8761/eureka/}

token:
  secret: ${TOKEN_SECRET:my-very-long-secret-key-1234567890123456}