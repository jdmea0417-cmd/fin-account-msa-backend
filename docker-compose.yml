services:
  # ---------------------------------------------------------------
  # 1. Kafka (KRaft 모드, Zookeeper 불필요, 단일 노드)
  # ---------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka
    hostname: kafka
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,CONTROLLER://kafka:9093,PLAINTEXT_HOST://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: "mOS8beCYQmOoDVwrzVVf9A"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------
  # 2. Confluent Schema Registry
  # ---------------------------------------------------------------
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    container_name: schema-registry
    hostname: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8091:8081"   # 호스트 8091 -> 컨테이너 8081
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC: _schemas
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: BACKWARD
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------
  # 3. Kafka UI
  # ---------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
      - schema-registry
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: fin-account-hub
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

  # ---------------------------------------------------------------
  # 4. Config Server
  # ---------------------------------------------------------------
  config-server:
    build: ./config-server
    container_name: fin-config-server
    hostname: config-server
    ports:
      - "8888:8888"

  # ---------------------------------------------------------------
  # 5. Eureka Server (Service Discovery)
  # ---------------------------------------------------------------
  eureka-server:
    build: ./eureka-server
    container_name: fin-eureka-server
    hostname: eureka-server
    depends_on:
      - config-server
    ports:
      - "8761:8761"

  # ---------------------------------------------------------------
  # 6. API Gateway
  # ---------------------------------------------------------------
  gateway:
    build: ./gateway
    container_name: fin-gateway
    hostname: gateway
    depends_on:
      - eureka-server
      - config-server
    ports:
      - "8000:8080"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  # ---------------------------------------------------------------
  # 7. Account Service
  # ---------------------------------------------------------------
  account-service:
    build: ./account-service
    container_name: fin-account-service
    hostname: account-service
    depends_on:
      - eureka-server
      - config-server
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  # ---------------------------------------------------------------
  # 8. Transaction Service
  # ---------------------------------------------------------------
  transaction-service:
    build: ./transaction-service
    container_name: fin-transaction-service
    hostname: transaction-service
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPRING_KAFKA_PROPERTIES_SCHEMA_REGISTRY_URL: http://schema-registry:8081
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://eureka-server:8761/eureka/

  # ---------------------------------------------------------------
  # 9. Notification Service
  # ---------------------------------------------------------------
  notification-service:
    build: ./notification-service
    container_name: fin-notification
    hostname: notification-service
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      eureka-server:
        condition: service_started
      config-server:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      CONFIG_SERVER_URI: http://config-server:8888
      EUREKA_URI: http://eureka-server:8761/eureka/

volumes:
  kafka-data:
