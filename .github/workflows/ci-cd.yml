name: Fin-Account Hub CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "develop" ]
  pull_request:
    branches: [ "main", "master", "develop" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Build and Test All Microservices
        run: |
          chmod +x ./account-service/mvnw
          ./account-service/mvnw clean test -Dspring.profiles.active=test

      - name: Package Applications
        run: |
          ./account-service/mvnw package -DskipTests

      - name: Verify Docker Compose Configuration
        run: |
          docker compose config

      - name: Test Docker Builds
        run: |
          docker compose build
