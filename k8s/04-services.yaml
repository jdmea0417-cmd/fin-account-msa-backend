---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-service
  namespace: fin-account-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      containers:
        - name: notification-service
          image: uniquecolor/notification-service:1.0.0
          ports:
            - containerPort: 8085
          envFrom:
            - configMapRef:
                name: fin-config
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: fin-account-hub
spec:
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8085
      targetPort: 8085
