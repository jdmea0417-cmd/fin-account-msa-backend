apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-service
  namespace: fin-account-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-service
  template:
    metadata:
      labels:
        app: eureka-service
    spec:
      containers:
        - name: eureka-service
          image: uniquecolor/eureka-service:1.0.0
          ports:
            - containerPort: 8761
---
apiVersion: v1
kind: Service
metadata:
  name: eureka-service
  namespace: fin-account-hub
spec:
  selector:
    app: eureka-service
  ports:
    - name: http
      port: 8761
      targetPort: 8761
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-service
  namespace: fin-account-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: config-service
  template:
    metadata:
      labels:
        app: config-service
    spec:
      containers:
        - name: config-service
          image: uniquecolor/config-service:1.0.0
          ports:
            - containerPort: 8888
---
apiVersion: v1
kind: Service
metadata:
  name: config-service
  namespace: fin-account-hub
spec:
  selector:
    app: config-service
  ports:
    - name: http
      port: 8888
      targetPort: 8888
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: fin-account-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: uniquecolor/gateway-service:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fin-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: fin-account-hub
spec:
  type: LoadBalancer
  selector:
    app: gateway-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
