apiVersion: apps/v1
kind: Deployment
metadata:
  name: eureka-service
  namespace: fin-account-hub
spec:
  replicas: 1
  selector:
    matchLabels:
      app: eureka-service
  template:
    metadata:
      labels:
        app: eureka-service
    spec:
      containers:
        - name: eureka-service
          image: uniquecolor/eureka-service:1.0.0
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: fin-account-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5