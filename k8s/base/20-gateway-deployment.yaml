apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: fin-account-hub
spec:
  replicas: 2
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: gateway
          image: uniquecolor/gateway-service:1.0.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: fin-account-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5